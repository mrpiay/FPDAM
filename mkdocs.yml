site_name: Programación didáctica DAM
site_description: Programaciones, unidades y proyectos de los módulos MP0483, MP0485, MP0488 y MP0489 del CFGS DAM (Galicia), basados en el RD 405/2023.
site_url: https://mrpiay.github.io/FPDAM/
repo_url: https://github.com/mrpiay/FPDAM
repo_name: mrpiay/FPDAM
edit_uri: ""
# El contenido vive en la raíz del repo; scripts/build-site.sh lo copia a docs/ antes de compilar.
docs_dir: docs

theme:
  name: material
  custom_dir: web/overrides
  language: es
  icon:
    logo: material/school
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow
    - toc.integrate
    - content.code.copy

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/external-links.js
  - assets/modulos.js

plugins:
  - search:
      lang: es

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

